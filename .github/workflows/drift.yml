name: Detección de deriva

# Cron nocturno, no en cada push: esto consume cuota real del proveedor.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Una ejecución a la vez: dos jobs solapados abrirían dos issues.
concurrency:
  group: drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, json
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - name: Comprobar deriva del modelo
        id: drift
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          php bin/llm-vcr drift --markdown > drift-report.md
          cat drift-report.md >> "$GITHUB_STEP_SUMMARY"

      # Un solo issue vivo para la deriva. Reabrir y comentar en vez de crear uno
      # nuevo cada noche: el historial queda en un hilo y el repo no acumula
      # veintiséis copias del mismo aviso.
      - name: Registrar la deriva en el issue de seguimiento
        if: steps.drift.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('drift-report.md', 'utf8').trim();
            const today = new Date().toISOString().slice(0, 10);
            const title = 'Deriva del modelo detectada';
            const marker = '<!-- llm-vcr-drift-tracker -->';

            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n\n**${today}**\n\n${report}\n\n[Ejecución del workflow](${run})`;

            // Busca el issue de seguimiento, esté abierto o cerrado.
            const { data: found } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue label:drift in:title "${title}"`,
              sort: 'created',
              order: 'desc',
              per_page: 1,
            });

            const existing = found.items[0];

            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['drift', 'ai'],
              });
              return;
            }

            if (existing.state === 'closed') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'open',
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body,
            });

      # Si ya no hay deriva, cierra el seguimiento. Un issue que se queda abierto
      # después de resolverse deja de significar nada.
      - name: Cerrar el seguimiento si ya no hay deriva
        if: steps.drift.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: found } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:drift in:title "Deriva del modelo detectada"`,
              per_page: 1,
            });

            const existing = found.items[0];
            if (!existing) {
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `Sin deriva en la ejecución del ${new Date().toISOString().slice(0, 10)}. Cerrando.`,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed',
              state_reason: 'completed',
            });
