name: Detección de deriva

# Cron nocturno, no en cada push: esto consume cuota real del proveedor.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, json
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - name: Comprobar deriva del modelo
        id: drift
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          php bin/llm-vcr drift --markdown > drift-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat drift-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Abrir issue si hay deriva
        if: steps.drift.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('drift-report.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deriva del modelo detectada — ${new Date().toISOString().slice(0, 10)}`,
              body: body + '\n\nGenerado automáticamente por `llm-vcr drift`.',
              labels: ['drift', 'ai'],
            });
